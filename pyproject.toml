[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decompbench"
version = "0.1.0"
description = "DecompGym: an executable environment for coding agents designing Benders decomposition and column generation solvers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "==3.12.11"
dependencies = ["gurobipy==11.0.3", "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
src = ["src"]

include = ["src/**/*.py"]
exclude = [".git", ".venv", "venv", ".mypy_cache", ".ruff_cache",
           "build", "dist", "data", "outputs", "assets", ".ipynb_checkpoints"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E203", "E501"]
unfixable = ["F401"]
ignore-init-module-imports = true

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D"]
"test*.py" = ["D"]
"src/**/__init__.py" = ["F401"]
